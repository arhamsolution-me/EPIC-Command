# MediaMTX Configuration for EPIC Command (WebRTC & RTSP Stream Engine)
# Native Production - Zero Docker Required
api: true
apiAddress: :9997

hls: true
hlsAddress: :8888

webrtc: true
webrtcAddress: :8889
webrtcICEServers2: []

rtsp: true
rtspAddress: :8554
protocols:
  - tcp

logLevel: info
logDestinations:
  - stdout

readTimeout: 10s
writeTimeout: 10s

paths:
  all_others:
    source: publisher
