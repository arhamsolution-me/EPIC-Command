# SonarQube Project Configuration for EPIC Command Web Frontend
sonar.projectKey=epic-command-web-frontend
sonar.projectName=epic-command-web-frontend
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/**,**/*.test.jsx,**/*.test.js,**/mocks/**,**/*.spec.js,**/*.spec.jsx,public/**,dist/**
sonar.coverage.exclusions=**/*
sonar.cpd.exclusions=**/*

# Ignore UI accessibility, styling, and code smell rules on custom controls
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22
